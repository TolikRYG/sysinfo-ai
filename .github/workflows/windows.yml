name: Windows native build

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'build.ps1'
      - '.github/workflows/windows.yml'
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run offline unit tests
        shell: pwsh
        run: ./build.ps1 -Clippy
      - name: Retain executable and resolved dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: sysinfo-ai-windows-x64
          path: |
            dist/sysinfo-ai.exe
            Cargo.lock
          if-no-files-found: error
